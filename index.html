<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TOEIC Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
  --text:#e8eaf0; --muted:#7b82a0; --accent:#4f7cff; --accent2:#7c5cff;
  --green:#22c55e; --green-bg:#052e16; --red:#ef4444; --red-bg:#2d0808;
  --yellow:#f59e0b; --radius:14px; --card-radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Noto Sans',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding-bottom:env(safe-area-inset-bottom,16px);
}

/* HEADER */
header{
  width:100%;max-width:680px;
  padding:20px 16px 0;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.logo{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;
  letter-spacing:-0.5px;color:var(--text);display:flex;align-items:center;gap:8px;
}
.logo-dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));}
.stats-bar{display:flex;gap:12px;font-size:12px;color:var(--muted);font-family:'Space Grotesk',sans-serif;}
.stat{display:flex;align-items:center;gap:4px;}
.stat-dot{width:6px;height:6px;border-radius:50%;}
.stat-dot.green{background:var(--green);}
.stat-dot.red{background:var(--red);}

/* CONTROLS */
.controls{width:100%;max-width:680px;padding:14px 16px 0;display:flex;flex-direction:column;gap:10px;}
.mode-toggle{
  display:flex;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px;
}
.mode-btn{
  flex:1;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;
  padding:8px 6px;border-radius:9px;border:none;cursor:pointer;
  background:transparent;color:var(--muted);transition:all .2s;
  letter-spacing:.01em;touch-action:manipulation;
}
.mode-btn.active{background:var(--accent);color:white;}

/* TOPICS — horizontal scroll on mobile */
.topics-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
.topics-scroll::-webkit-scrollbar{display:none;}
.topics-wrap{display:flex;gap:6px;width:max-content;}
.topic-chip{
  font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;
  padding:6px 13px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;
  transition:all .18s;white-space:nowrap;touch-action:manipulation;
}
.topic-chip.active{background:var(--accent);border-color:var(--accent);color:white;}

/* PROGRESS */
.progress-wrap{width:100%;max-width:680px;padding:12px 16px 0;}
.progress-track{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .4s ease;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:'Space Grotesk',sans-serif;margin-top:5px;}

/* CARD */
.card-area{width:100%;max-width:680px;padding:14px 16px 0;}
.flashcard{
  width:100%;min-height:220px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--card-radius);padding:32px 24px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;transition:border-color .25s,background .25s,box-shadow .25s;
}
.flashcard.correct{border-color:var(--green);background:var(--green-bg);box-shadow:0 0 32px rgba(34,197,94,.12);}
.flashcard.wrong{border-color:var(--red);background:var(--red-bg);box-shadow:0 0 32px rgba(239,68,68,.12);}

.card-topic{
  font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  margin-bottom:14px;padding:3px 10px;border:1px solid var(--border);border-radius:20px;
}
.card-word{
  font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:clamp(26px,8vw,42px);
  letter-spacing:-0.5px;text-align:center;color:var(--text);line-height:1.1;margin-bottom:10px;
}
.card-word.vn{font-size:clamp(20px,5.5vw,30px);letter-spacing:-.3px;}
.card-example{font-size:12px;color:var(--muted);text-align:center;font-style:italic;max-width:100%;line-height:1.6;}
.card-counter{position:absolute;top:14px;right:16px;font-family:'Space Grotesk',sans-serif;font-size:11px;color:var(--muted);}
.result-icon{position:absolute;top:14px;left:16px;font-size:20px;display:none;}
.flashcard.correct .result-icon.ok{display:block;}
.flashcard.wrong .result-icon.fail{display:block;}

/* INPUT */
.input-area{width:100%;max-width:680px;padding:12px 16px 0;}
.input-row{display:flex;gap:8px;align-items:stretch;}
#answer-input{
  flex:1;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);color:var(--text);
  font-family:'Noto Sans',sans-serif;font-size:16px;
  padding:13px 16px;outline:none;transition:border-color .2s;
  -webkit-appearance:none;
}
#answer-input:focus{border-color:var(--accent);}
#answer-input.correct{border-color:var(--green);background:var(--green-bg);}
#answer-input.wrong{border-color:var(--red);background:var(--red-bg);}
#answer-input::placeholder{color:var(--muted);}

.btn-check{
  font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;
  padding:13px 20px;background:var(--accent);color:white;
  border:none;border-radius:var(--radius);cursor:pointer;
  transition:opacity .2s,transform .1s;white-space:nowrap;touch-action:manipulation;
  min-width:90px;
}
.btn-check:active{transform:scale(.97);}
.btn-check:disabled{opacity:.4;cursor:not-allowed;}

/* FEEDBACK */
.feedback{
  width:100%;max-width:680px;padding:8px 16px 0;
  min-height:26px;font-size:13px;font-family:'Space Grotesk',sans-serif;font-weight:500;
}
.feedback.correct{color:var(--green);}
.feedback.wrong{color:var(--red);}

/* NAV */
.nav-area{width:100%;max-width:680px;padding:10px 16px 0;display:flex;gap:8px;}
.btn-nav{
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;
  padding:11px 18px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:var(--radius);cursor:pointer;
  transition:all .18s;touch-action:manipulation;flex:1;
}
.btn-nav:active{opacity:.75;}
.btn-skip{color:var(--muted);}

/* SWIPE HINT — mobile only */
.swipe-hint{
  font-size:11px;color:var(--muted);font-family:'Space Grotesk',sans-serif;
  text-align:center;padding:10px 16px 20px;
}
.swipe-hint.desktop{display:none;}

/* SCORE */
.score-panel{
  width:100%;max-width:680px;margin:20px 16px 0;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--card-radius);padding:40px 24px;text-align:center;display:none;
}
.score-panel.show{display:block;}
.score-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.5px;margin-bottom:6px;}
.score-sub{color:var(--muted);font-size:13px;margin-bottom:24px;}
.score-big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:64px;letter-spacing:-2px;line-height:1;color:var(--accent);margin-bottom:4px;}
.score-detail{
  display:flex;justify-content:center;flex-wrap:wrap;gap:16px 24px;
  font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--muted);
  margin:14px 0 32px;
}
.score-detail span{display:flex;align-items:center;gap:6px;}
.btn-restart{
  font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;
  padding:13px 32px;background:var(--accent);color:white;
  border:none;border-radius:var(--radius);cursor:pointer;transition:opacity .2s;
  width:100%;touch-action:manipulation;
}
.btn-restart:active{opacity:.8;}

/* RESPONSIVE — desktop tweaks */
@media(min-width:600px){
  header{padding:24px 24px 0;}
  .controls{padding:16px 24px 0;flex-direction:row;flex-wrap:wrap;align-items:flex-start;}
  .mode-toggle{flex-shrink:0;}
  .topics-scroll{flex:1;overflow-x:auto;}
  .topics-wrap{width:auto;flex-wrap:wrap;}
  .progress-wrap,.card-area,.input-area,.feedback,.nav-area{padding-left:24px;padding-right:24px;}
  .flashcard{min-height:250px;padding:38px 40px 30px;}
  .btn-nav{flex:0 0 auto;}
  .btn-skip{margin-left:auto;flex:0 0 auto;}
  .swipe-hint{display:none;}
  .swipe-hint.desktop{display:block;font-size:11.5px;}
  .score-panel{margin-left:24px;margin-right:24px;}
}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>TOEIC Flashcards</div>
  <div class="stats-bar">
    <div class="stat"><div class="stat-dot green"></div><span id="stat-correct">0 đúng</span></div>
    <div class="stat"><div class="stat-dot red"></div><span id="stat-wrong">0 sai</span></div>
  </div>
</header>

<div class="controls">
  <div class="mode-toggle">
    <button class="mode-btn active" onclick="setMode('en-vn')">EN → VN</button>
    <button class="mode-btn" onclick="setMode('vn-en')">VN → EN</button>
    <button class="mode-btn" onclick="setMode('random')">🔀 Mix</button>
  </div>
  <div class="topics-scroll"><div class="topics-wrap" id="topic-chips"></div></div>
</div>

<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="progress-label"><span id="prog-text">Thẻ 0 / 0</span><span id="prog-pct">0%</span></div>
</div>

<div class="card-area" id="card-area">
  <div class="flashcard" id="flashcard">
    <span class="result-icon ok">✅</span>
    <span class="result-icon fail">❌</span>
    <div class="card-counter" id="card-counter">1 / 10</div>
    <div class="card-topic" id="card-topic">Business & Office</div>
    <div class="card-word" id="card-word">agenda</div>
    <div class="card-example" id="card-example">The manager sent out the meeting agenda yesterday.</div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <input type="text" id="answer-input" placeholder="Nhập nghĩa tiếng Việt..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
    <button class="btn-check" id="btn-check" onclick="checkAnswer()">Kiểm tra</button>
  </div>
</div>

<div class="feedback" id="feedback"></div>

<div class="nav-area">
  <button class="btn-nav" onclick="prevCard()">← Trước</button>
  <button class="btn-nav btn-skip" onclick="skipCard()">Bỏ qua →</button>
</div>

<div class="swipe-hint">Vuốt trái/phải để bỏ qua · Nhấn Kiểm tra để chấm</div>
<div class="swipe-hint desktop">Nhấn <b>Enter</b> để kiểm tra &nbsp;·&nbsp; <b>→</b> bỏ qua &nbsp;·&nbsp; <b>←</b> quay lại</div>

<div class="score-panel" id="score-panel">
  <div class="score-title">🎉 Hoàn thành!</div>
  <div class="score-sub">Kết quả lần này</div>
  <div class="score-big" id="score-pct">0%</div>
  <div class="score-detail">
    <span><span style="color:var(--green)">✓</span><span id="sc-correct">0 đúng</span></span>
    <span><span style="color:var(--red)">✗</span><span id="sc-wrong">0 sai</span></span>
    <span><span style="color:var(--muted)">⏩</span><span id="sc-skip">0 bỏ qua</span></span>
  </div>
  <button class="btn-restart" onclick="restart()">Làm lại</button>
</div>

<script>
const ALL_WORDS=[
  // Business & Office

let mode='en-vn',activeTopic='all',deck=[],idx=0,answered=false;
let correctCount=0,wrongCount=0,skipCount=0;
const topics=[...new Set(ALL_WORDS.map(w=>w.topic))];

function normalize(s){return s.toLowerCase().trim().replace(/\s+/g,' ');}
function acceptableMatch(input,card,cardMode){
  const inp=normalize(input);
  const pool=cardMode==='en-vn'
    ?[card.vn,...(card.vn_alt||[])]
    :[card.en,...(card.en_alt||[])];
  return pool.map(a=>normalize(a)).includes(inp);
}

function buildTopicChips(){
  const wrap=document.getElementById('topic-chips');
  wrap.innerHTML='';
  const a=document.createElement('button');
  a.className='topic-chip active';a.textContent='Tất cả';
  a.onclick=()=>setTopic('all',a);wrap.appendChild(a);
  topics.forEach(t=>{
    const b=document.createElement('button');
    b.className='topic-chip';b.textContent=t;
    b.onclick=()=>setTopic(t,b);wrap.appendChild(b);
  });
}

function setTopic(t,btn){
  activeTopic=t;
  document.querySelectorAll('.topic-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');restart();
}
function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach((b,i)=>{
    b.classList.toggle('active',['en-vn','vn-en','random'][i]===m);
  });restart();
}

function buildDeck(){
  let pool=activeTopic==='all'?[...ALL_WORDS]:ALL_WORDS.filter(w=>w.topic===activeTopic);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  deck=pool.map(w=>{let m=mode;if(m==='random')m=Math.random()<.5?'en-vn':'vn-en';return{...w,cardMode:m};});
  idx=0;correctCount=0;wrongCount=0;skipCount=0;
}

function renderCard(){
  if(idx>=deck.length){showScore();return;}
  const card=deck[idx];answered=false;
  document.getElementById('flashcard').className='flashcard';
  document.getElementById('card-topic').textContent=card.topic;
  document.getElementById('card-counter').textContent=`${idx+1} / ${deck.length}`;
  const wordEl=document.getElementById('card-word');
  const inp=document.getElementById('answer-input');
  if(card.cardMode==='en-vn'){
    wordEl.textContent=card.en;wordEl.className='card-word';
    inp.placeholder='Nhập nghĩa tiếng Việt...';
  }else{
    wordEl.textContent=card.vn;wordEl.className='card-word vn';
    inp.placeholder='Nhập từ tiếng Anh...';
  }
  // Hide example only for VN→EN (example contains the English answer)
  const exEl=document.getElementById('card-example');
  exEl.textContent=card.ex;
  exEl.style.visibility=card.cardMode==='vn-en'?'hidden':'visible';
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  inp.value='';inp.className='';inp.disabled=false;
  document.getElementById('btn-check').disabled=false;
  updateProgress();updateStats();
  setTimeout(()=>inp.focus(),80);
}

function checkAnswer(){
  if(answered){nextCard();return;}
  const inp=document.getElementById('answer-input');
  const userAns=inp.value.trim();
  if(!userAns)return;
  const card=deck[idx];
  const ok=acceptableMatch(userAns,card,card.cardMode);
  answered=true;inp.disabled=true;document.getElementById('btn-check').disabled=true;
  document.getElementById('card-example').style.visibility='visible';
  const fc=document.getElementById('flashcard'),fb=document.getElementById('feedback');
  if(ok){
    fc.className='flashcard correct';inp.className='correct';
    fb.textContent='✓ Chính xác!';fb.className='feedback correct';correctCount++;
  }else{
    const allAns=card.cardMode==='en-vn'
      ?[card.vn,...(card.vn_alt||[])]
      :[card.en,...(card.en_alt||[])];
    fc.className='flashcard wrong';inp.className='wrong';
    fb.textContent=`✗ Sai. Đáp án: "${allAns.join(' / ')}"`;fb.className='feedback wrong';wrongCount++;
  }
  updateStats();
  setTimeout(()=>nextCard(),1600);
}

function nextCard(){idx++;renderCard();}
function prevCard(){if(idx>0){idx--;renderCard();}}
function skipCard(){
  if(answered){nextCard();return;}
  skipCount++;idx++;updateStats();renderCard();
}
function updateProgress(){
  const pct=deck.length?Math.round((idx/deck.length)*100):0;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('prog-text').textContent=`Thẻ ${idx} / ${deck.length}`;
  document.getElementById('prog-pct').textContent=pct+'%';
}
function updateStats(){
  document.getElementById('stat-correct').textContent=`${correctCount} đúng`;
  document.getElementById('stat-wrong').textContent=`${wrongCount} sai`;
}
function showScore(){
  document.getElementById('card-area').style.display='none';
  document.querySelector('.input-area').style.display='none';
  document.querySelector('.nav-area').style.display='none';
  document.querySelector('.feedback').style.display='none';
  document.querySelectorAll('.swipe-hint').forEach(e=>e.style.display='none');
  const total=correctCount+wrongCount+skipCount;
  const pct=total?Math.round((correctCount/total)*100):0;
  document.getElementById('score-pct').textContent=pct+'%';
  document.getElementById('sc-correct').textContent=correctCount+' đúng';
  document.getElementById('sc-wrong').textContent=wrongCount+' sai';
  document.getElementById('sc-skip').textContent=skipCount+' bỏ qua';
  document.getElementById('score-panel').classList.add('show');
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('prog-text').textContent='Hoàn thành!';
  document.getElementById('prog-pct').textContent='100%';
}
function restart(){
  document.getElementById('card-area').style.display='';
  document.querySelector('.input-area').style.display='';
  document.querySelector('.nav-area').style.display='';
  document.querySelector('.feedback').style.display='';
  document.querySelectorAll('.swipe-hint').forEach(e=>e.style.display='');
  document.getElementById('score-panel').classList.remove('show');
  buildDeck();renderCard();
}

// Touch swipe on card
let touchX=0;
document.getElementById('flashcard').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
document.getElementById('flashcard').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)>60){dx<0?skipCard():prevCard();}
},{passive:true});

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();if(!answered)checkAnswer();else nextCard();}
  if(e.key==='ArrowRight'&&!document.getElementById('answer-input').matches(':focus'))skipCard();
  if(e.key==='ArrowLeft'&&!document.getElementById('answer-input').matches(':focus'))prevCard();
});

buildTopicChips();restart();
</script>
